[package]
name = "echo-studio"
version = "0.1.1"
description = "Visual manager for EchoVault memories and AI coding agent session logs"
authors = ["stillmvd"]
edition = "2021"

[lib]
name = "echo_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
dirs = "7"
serde_yaml = "0.9"
notify = "8"
notify-debouncer-mini = "0.7"
humantime = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "s"

[dev-dependencies]
tempfile = "3"
